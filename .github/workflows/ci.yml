name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # `secrets` can't be used in a step-level `if`, so surface it as env first.
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Enable corepack (pins pnpm from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Package boundaries
        run: pnpm exec turbo boundaries

      - name: Lint, typecheck, test
        run: pnpm run lint && pnpm run typecheck && pnpm run test

      # The web build prerenders every post from Notion, so it can only run where
      # the credentials exist. Forks and secret-less setups still get the gate above.
      - name: Build
        if: env.NOTION_API_KEY != ''
        run: pnpm run build

  # Separate job so the ~1-2 min Chromium download never delays the fast gates
  # above; either job failing still fails CI.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack (pins pnpm from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # allowBuilds blocks playwright's install script, so fetch the browser here.
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Renders every screen against the real stylesheet at four viewports in
      # light and dark, asserting no overflow, clipping, or theme regression.
      - name: Layout audit
        run: pnpm --filter web test:browser
