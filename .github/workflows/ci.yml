name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Enable corepack (pins pnpm from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Package boundaries
        run: pnpm exec turbo boundaries

      - name: Lint, typecheck, test
        run: pnpm run lint && pnpm run typecheck && pnpm run test

      # The web build prerenders every post from Notion, so it can only run where
      # the credentials exist. Forks and secret-less setups still get the gate above.
      - name: Build
        if: ${{ secrets.NOTION_API_KEY != '' }}
        run: pnpm run build
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
